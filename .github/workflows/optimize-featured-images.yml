name: Optimize featured images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/optimize-featured-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert featured images to WebP
        run: |
          cwebp -quiet -q 95 \
            content/news/2026-11-lotus-tensor-network-collaboration/featured.png \
            -o content/news/2026-11-lotus-tensor-network-collaboration/featured.webp

          cwebp -quiet -q 95 \
            content/news/2026-11-seafood-press-release/featured.png \
            -o content/news/2026-11-seafood-press-release/featured.webp

          rm content/news/2026-11-lotus-tensor-network-collaboration/featured.png
          rm content/news/2026-11-seafood-press-release/featured.png

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/news/2026-11-lotus-tensor-network-collaboration/featured.png \
            content/news/2026-11-lotus-tensor-network-collaboration/featured.webp \
            content/news/2026-11-seafood-press-release/featured.png \
            content/news/2026-11-seafood-press-release/featured.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize featured images"
            git push
          fi
